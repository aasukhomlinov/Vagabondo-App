<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; font-size: 12px; background: #fff; }
  h3 { padding: 10px 12px 6px; font-size: 13px; color: #1a1a2e; border-bottom: 1px solid #eee; }
  #log {
    height: 264px;
    overflow-y: auto;
    padding: 8px 12px;
    background: #fafafa;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .entry { padding: 2px 0; line-height: 1.5; }
  .info    { color: #374151; }
  .success { color: #10B981; font-weight: bold; }
  .warn    { color: #F59E0B; }
  .error   { color: #EF4444; font-weight: bold; }
</style>
</head>
<body>
  <h3>Vagabondo – Screen Generator Log</h3>
  <div id="log"><div class="entry info">Initialising…</div></div>
  <script>
    const logEl = document.getElementById('log');
    window.onmessage = function(event) {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      const div = document.createElement('div');
      div.className = 'entry ' + (msg.level || 'info');
      div.textContent = msg.text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    };
  </script>
</body>
</html>
